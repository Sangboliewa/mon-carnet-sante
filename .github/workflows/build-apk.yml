name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:   # bouton manuel sur GitHub

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - uses: actions/checkout@v4

      # 2. Java 17
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Dépendances npm
      - run: npm ci

      # 5. Variables d'environnement Supabase
      - name: Créer .env.local
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local

      # 6. Sync Capacitor (copie config dans le projet Android)
      - run: npx cap sync android

      # 7. Rendre gradlew exécutable
      - run: chmod +x android/gradlew

      # 8. Build APK debug (ne nécessite pas de keystore)
      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # 9. Upload l'APK comme artefact téléchargeable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-carnet-sante-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
